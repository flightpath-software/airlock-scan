# airlock custom Semgrep taint rules (JavaScript / TypeScript).
#
# Strategy A, Tier 1: deterministic source -> sink dataflow, no execution of the
# target. Mirrors the Python pack for the npm ecosystem (the other primary
# supply-chain / skill surface). SARIF "error" level -> HIGH.
rules:
  - id: airlock-js-untrusted-input-to-exec
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted input flows into command execution (possible command injection
      via child_process).
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      airlock: taint
    pattern-sources:
      - pattern-either:
          - pattern: process.env
          - pattern: process.env.$X
          - pattern: process.argv
          - pattern: fs.readFileSync(...)
      # fs.readFile's callback is matched by location, not by the whole call: a
      # bare `pattern: fs.readFile(...)` would taint everything lexically inside
      # the callback body (even an unused sink in an unrelated branch), since the
      # `...` wildcard matches the callback literal itself. Binding to just the
      # data parameter makes this real dataflow instead of lexical containment.
      # This block is repeated verbatim in each rule on purpose: `semgrep --validate`
      # rejects YAML anchors/aliases, so it can't be factored out (a test enforces it).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fs.readFile(..., ($ERR, $DATA) => {...})
              - pattern-inside: |
                  fs.readFile(..., function ($ERR, $DATA) {...})
          - focus-metavariable: $DATA
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec(...)
              - pattern: child_process.execSync(...)
              - pattern: child_process.spawn(...)
              - pattern: child_process.spawnSync(...)
              - pattern: cp.exec(...)
              - pattern: exec(...)
              - pattern: execSync(...)

  - id: airlock-js-untrusted-input-to-eval
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted input flows into dynamic code evaluation (eval / Function
      constructor).
    metadata:
      category: security
      cwe: "CWE-94: Code Injection"
      airlock: taint
    pattern-sources:
      - pattern-either:
          - pattern: process.env
          - pattern: process.env.$X
          - pattern: process.argv
          - pattern: fs.readFileSync(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fs.readFile(..., ($ERR, $DATA) => {...})
              - pattern-inside: |
                  fs.readFile(..., function ($ERR, $DATA) {...})
          - focus-metavariable: $DATA
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval(...)
              - pattern: Function(...)
              - pattern: new Function(...)

  - id: airlock-js-secret-or-file-exfiltration
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Environment or local file contents flow into an outbound network call
      (possible exfiltration).
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information"
      airlock: taint
    pattern-sources:
      - pattern-either:
          - pattern: process.env
          - pattern: process.env.$X
          - pattern: fs.readFileSync(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fs.readFile(..., ($ERR, $DATA) => {...})
              - pattern-inside: |
                  fs.readFile(..., function ($ERR, $DATA) {...})
          - focus-metavariable: $DATA
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch(...)
              - pattern: axios.post(...)
              - pattern: axios.get(...)
              - pattern: http.request(...)
              - pattern: https.request(...)
