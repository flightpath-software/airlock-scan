  - https://x.com/steipete/status/1954593439347032167
  runtime_fingerprints: []
  tools:
  - name: Read
    action_class: read
  - name: Write
    action_class: edit
  - name: Edit
    action_class: edit
  - name: MultiEdit
    action_class: edit
  - name: NotebookEdit
    action_class: edit
  - name: Grep
    action_class: search
  - name: Glob
    action_class: search
  - name: LS
    action_class: read
  - name: Bash
    action_class: execute
  - name: BashOutput
    action_class: read
  - name: KillShell
    action_class: execute
  - name: WebSearch
    action_class: network
  - name: WebFetch
    action_class: network
  - name: TodoWrite
    action_class: plan
  - name: Task
    action_class: delegate
  - name: ExitPlanMode
    action_class: plan
  - name: AskUserQuestion
