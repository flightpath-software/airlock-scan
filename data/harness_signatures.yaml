# Harness tool-signature dataset (YAML mirror of harness_tools.json).
# Lossless: round-trips back to identical JSON.
schema_version: '1.0'
generated: '2026-06-01'
description: 'Tool signatures exposed by common coding-agent harnesses, captured by platform. Intended
  to drive ''fake harness'' canary sets: register a harness''s tool names as inert decoys, and if an injected
  payload causes the quarantined model to invoke one, the fired name fingerprints which harness the attack
  was tailored for.'
action_classes:
  read: Reads files/dirs/state without modifying.
  search: Searches code/files (grep, glob, semantic).
  edit: Creates, modifies, or deletes files.
  execute: Runs shell/terminal commands or processes.
  network: Fetches URLs or searches the web (exfil-relevant).
  delegate: Spawns or dispatches a sub-agent.
  plan: Manages a plan/todo or plan-mode interaction.
  mcp: Invokes Model Context Protocol tools/resources.
  browser: Drives a browser.
  memory: Persists info across sessions.
  other: Misc (diagrams, completion signals, thinking, etc.).
notes:
- Foundational CLIs (Claude Code, Codex, Gemini) and third-party harnesses are mixed; see each entry's
  'kind'.
- 'Aider is intentionally omitted as a tool entry: it does not expose JSON/function-call tools. It edits
  via SEARCH/REPLACE blocks and is driven by slash-commands (/add, /run, /commit, /diff), so it has no
  canary-style tool-name signature.'
- Cursor ships both an IDE agent and a standalone CLI (cursor-agent). The IDE agent tool names are confirmed;
  cursor-agent exposes a smaller (~10) overlapping set (e.g. Shell, Delete) whose exact names are only
  partially public — treat CLI-specific names as lower confidence.
- Warp does not publicly enumerate fixed internal function-call tool names the way the open-source harnesses
  do; its entry is capability-level and inferred from documented permission categories (Reading files,
  Creating plans, Executing commands, Calling MCP servers).
