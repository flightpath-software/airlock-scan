name: codeql

# Static analysis via GitHub CodeQL. Scoped to Python — the only CodeQL-supported language shipped
# here (the rest of airlock is POSIX shell, which CodeQL does not analyze; shell is syntax-checked in
# ci.yml). Results appear under the repo's Security → Code scanning tab.

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  schedule:
    # Weekly baseline scan so drift is caught even without a push.
    - cron: "27 3 * * 1"   # Mondays 03:27 UTC (off-peak, non-round minute)

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to code scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: python
          # Default query suite is enough for the baseline; swap to
          # `security-and-quality` later if you want broader (noisier) coverage.

      # Python is interpreted — no build step needed; autobuild is a safe no-op.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:python"
          # Results upload to Security → Code scanning (free on public repos). If this step ever
          # 403s with "Code Security must be enabled", turn on code scanning in
          # Settings → Advanced Security.
